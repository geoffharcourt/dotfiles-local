[tools]
aube = "latest"
node = "latest"
pnpm = "latest"
ruby = {
  version = "latest",
  postinstall = "gem install bundler-audit gem-shut-the-fuck-up neovim ruby-lsp",
  install_env = { RUBY_CONFIGURE_OPTS = "--disable-install-doc" }
}
rust = "latest"

[settings]
env_shell_expand = false
experimental = true
fetch_remote_versions_cache = "7d"
fetch_remote_versions_timeout = "5s"
http_timeout = "5s"
idiomatic_version_file_enable_tools = ["ruby", "node"]
ruby.compile = false

[tasks.pnpm-globals]
description = "Install global JS tools with pnpm from ~/.default-pnpm-packages"
run = """
export PNPM_HOME="${PNPM_HOME:-$HOME/Library/pnpm}"
export PATH="$PNPM_HOME/bin:$PATH"
sed -e '/^#/d' -e '/^$/d' ~/.default-pnpm-packages | xargs pnpm add --global
"""

[bootstrap.brew.taps]
"anomalyco/tap" = "https://github.com/anomalyco/homebrew-tap.git"
"buildkite/buildkite" = "https://github.com/buildkite/homebrew-buildkite.git"
"claui/public" = "https://github.com/claui/homebrew-public.git"
"dopplerhq/cli" = "https://github.com/dopplerhq/homebrew-cli.git"

