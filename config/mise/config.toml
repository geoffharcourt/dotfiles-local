[tools]
aube = "latest"
node = "latest"
ruby = {
  version = "latest",
  postinstall = "gem install bundler-audit gem-shut-the-fuck-up neovim ruby-lsp",
  install_env = { RUBY_CONFIGURE_OPTS = "--disable-install-doc" }
}
rust = "latest"

[settings]
env_shell_expand = false
experimental = true
fetch_remote_versions_cache = "7d"
fetch_remote_versions_timeout = "5s"
http_timeout = "5s"
idiomatic_version_file_enable_tools = ["ruby", "node"]
ruby.compile = false

[hooks]
# Enabling corepack will install the `pnpm` package manager specified in your package.json
# alternatively, you can also install `pnpm` with mise
postinstall = 'npx corepack enable'
